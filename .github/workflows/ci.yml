name: AulaControl CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        # Reconcile bun.lock with package.json; frozen mode currently fails because esbuild is stale in the lockfile.
        run: bun install
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
