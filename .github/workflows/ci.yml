name: AulaControl CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        # Regenerate the lockfile in the runner before checking/building.
        # The repository lockfile should be committed after dependency updates.
        run: bun install
      - name: Validate server syntax
        run: node --check server.js
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
